plugins {
    id 'com.android.application'
}

def gdxVersion = '1.12.1'

android {
    namespace 'com.vexorix.card'
    compileSdk 34
    defaultConfig {
        applicationId 'com.vexorix.card'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
    sourceSets {
        main { jniLibs.srcDirs = ['src/main/jniLibs'] }
    }
}

configurations { natives }

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('src/main/jniLibs/arm64-v8a')
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('src/main/jniLibs/armeabi-v7a')
            if (outputDir != null) {
                outputDir.mkdirs()
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.endsWith('JniLibFolders') }.configureEach {
    it.dependsOn 'copyAndroidNatives'
}
